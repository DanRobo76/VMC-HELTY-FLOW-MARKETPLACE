name: Controlli HACS e hassfest

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  hacs:
    name: Controllo HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Controllo hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  pytest:
    name: Test pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Installa le dipendenze dei test
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component
          # Il frontend deve essere la versione richiesta da Home Assistant installato
          FRONTEND=$(grep '^home-assistant-frontend==' "$(python -c 'import homeassistant, pathlib; print(pathlib.Path(homeassistant.__file__).parent / "package_constraints.txt")')")
          pip install "$FRONTEND"
      - name: Esegui i test
        run: pytest -q
